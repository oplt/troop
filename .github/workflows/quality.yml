name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/app
  REDIS_URL: redis://127.0.0.1:6379/0
  JWT_SECRET: ci-only-secret-not-for-production
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  REFRESH_TOKEN_EXPIRE_DAYS: 30
  CELERY_TASK_ALWAYS_EAGER: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"
          python -c "import backend.modules.workforce; print('backend import ok')"
        env:
          PYTHONPATH: .
      - name: Ruff lint (backend production)
        working-directory: backend
        run: >
          ruff check
          --ignore E501
          core
          api
          modules
          workers
          db
      - name: Ruff format check (backend production)
        working-directory: backend
        run: >
          ruff format --check
          core
          api
          modules
          workers
          db
      - name: Alembic upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - name: Alembic single-head + current smoke
        working-directory: backend
        run: |
          set -euo pipefail
          heads="$(alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $count" >&2
            exit 1
          fi
          alembic current
      - name: Migration integrity + model import contract
        run: >
          python -m pytest
          backend/tests/test_migration_integrity.py
          backend/tests/test_workforce_migration_contract.py
          -q
      - name: Workforce + contract unit tests
        run: >
          python -m pytest
          backend/tests/test_workforce_domain.py
          backend/tests/test_workforce_migration_contract.py
          backend/tests/test_skill_validation.py
          backend/tests/test_action_policy.py
          backend/tests/test_workforce_acceptance.py
          backend/tests/test_workforce_ecosystem_p3.py
          backend/tests/test_incomplete_p0_fixes.py
          backend/tests/test_workflow_runtime.py
          backend/tests/test_task_orchestration_contract.py
          backend/tests/test_phase6_modularization.py
          -q
      - name: Backend unit tests
        run: >
          python -m pytest backend/tests -m "not integration" -q
      - name: Workforce PostgreSQL E2E
        env:
          TROOP_RUN_PG_E2E: "1"
        run: >
          python -m pytest backend/tests/test_workforce_pg_e2e.py -m integration -q


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Guard TypeScript directives (project detail / hierarchy)
        run: |
          set -euo pipefail
          if rg -q '@ts-nocheck' src/pages/projectDetail src/pages/hierarchy; then
            echo "@ts-nocheck is not allowed under src/pages/projectDetail or src/pages/hierarchy" >&2
            rg -n '@ts-nocheck' src/pages/projectDetail src/pages/hierarchy >&2 || true
            exit 1
          fi
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e-playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/app
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-only-secret-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      CELERY_TASK_ALWAYS_EAGER: "true"
      APP_ENV: dev
      FRONTEND_URL: http://127.0.0.1:5173
      SECRETS_ENCRYPTION_KEY: eUL60QMh9TqTrgJy-50f2CWp2yhh50lTM5Z-Q-BOY1A=
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"
      - name: Alembic upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E (critical flows)
        working-directory: frontend
        run: pnpm exec playwright test --project=chromium

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend dependency audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip install -e "./backend[dev]"
          pip-audit
        env:
          PYTHONPATH: .
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend production dependency audit
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level critical

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose manifest
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.ci config --quiet
      - name: Start Postgres and Redis
        run: |
          set -euo pipefail
          docker compose -f infra/docker-compose.yml --env-file infra/.env.ci up -d postgres redis
          for attempt in $(seq 1 30); do
            if docker compose -f infra/docker-compose.yml --env-file infra/.env.ci exec -T postgres pg_isready -U ci -d app \
              && docker compose -f infra/docker-compose.yml --env-file infra/.env.ci exec -T redis redis-cli ping | grep -q PONG; then
              echo "Postgres and Redis are healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Postgres/Redis health" >&2
          docker compose -f infra/docker-compose.yml --env-file infra/.env.ci ps
          exit 1
      - name: Backend import smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"
          python -c "import backend.modules.workforce; from backend.api.main import app; print('backend import ok:', app.title)"
        env:
          PYTHONPATH: .
      - name: Tear down compose stack
        if: always()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.ci down -v
