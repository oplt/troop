name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/app
  REDIS_URL: redis://127.0.0.1:6379/0
  JWT_SECRET: ci-only-secret-not-for-production
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  REFRESH_TOKEN_EXPIRE_DAYS: 30
  CELERY_TASK_ALWAYS_EAGER: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"
          python -c "import backend.modules.workforce; print('backend import ok')"
        env:
          PYTHONPATH: .
      - name: Ruff lint (backend package + workforce)
        working-directory: backend
        run: >
          ruff check
          --ignore E501
          core
          api
          modules/workforce
          modules/orchestration/control_plane_runtime.py
          modules/orchestration/skill_runtime.py
          modules/orchestration/constants.py
          tests/test_workforce_domain.py
          tests/test_workforce_migration_contract.py
          tests/test_skill_validation.py
      - name: Ruff format check
        working-directory: backend
        run: >
          ruff format --check
          modules/workforce
          modules/orchestration/skill_runtime.py
          modules/orchestration/control_plane_runtime.py
          tests/test_workforce_domain.py
          tests/test_workforce_migration_contract.py
          tests/test_skill_validation.py
      - name: Alembic upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - name: Alembic current smoke
        working-directory: backend
        run: alembic current
      - name: Workforce + contract unit tests
        run: >
          python -m pytest
          backend/tests/test_workforce_domain.py
          backend/tests/test_workforce_migration_contract.py
          backend/tests/test_skill_validation.py
          backend/tests/test_action_policy.py
          backend/tests/test_workforce_acceptance.py
          backend/tests/test_workforce_ecosystem_p3.py
          backend/tests/test_incomplete_p0_fixes.py
          backend/tests/test_workflow_runtime.py
          backend/tests/test_task_orchestration_contract.py
          backend/tests/test_phase6_modularization.py
          -q
      - name: Backend unit tests
        run: >
          python -m pytest backend/tests -m "not integration" -q
          --ignore=backend/tests/test_deerflow_adapters.py
      - name: Workforce PostgreSQL E2E
        env:
          TROOP_RUN_PG_E2E: "1"
        run: >
          python -m pytest backend/tests/test_workforce_pg_e2e.py -m integration -q


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
