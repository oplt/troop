name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/app
  REDIS_URL: redis://127.0.0.1:6379/0
  JWT_SECRET: ci-only-secret-not-for-production
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  REFRESH_TOKEN_EXPIRE_DAYS: 30
  CELERY_TASK_ALWAYS_EAGER: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
      - name: Validate baseline tool
        run: python backend/tools/phase0_baseline.py --help
      - name: Enforce runtime logging policy
        run: python backend/tools/check_logging_policy.py
      - name: Enforce external call policy
        run: python backend/tools/check_external_call_policy.py
      - name: Ruff lint
        working-directory: backend
        run: >-
          ruff check
          core/request_context.py
          api/middleware/correlation_id.py
          api/middleware/request_logging.py
          api/middleware/public_rate_limit.py
          api/deps/auth.py
          workers/context.py
          workers/celery_app.py
          workers/orchestration.py
          workers/email.py
          tools/phase0_baseline.py
          tools/check_logging_policy.py
          tools/check_external_call_policy.py
          core/external_http.py
          core/logging.py
          modules/rag/observability.py
          tests/test_phase1_operations.py
          tests/test_phase0_context.py
          tests/test_external_call_policy.py
      - name: Ruff format
        working-directory: backend
        run: >-
          ruff format --check
          core/request_context.py
          api/middleware/correlation_id.py
          api/middleware/request_logging.py
          api/middleware/public_rate_limit.py
          api/deps/auth.py
          workers/context.py
          workers/celery_app.py
          workers/orchestration.py
          workers/email.py
          tools/phase0_baseline.py
          tools/check_logging_policy.py
          core/external_http.py
          core/logging.py
          modules/rag/observability.py
          tests/test_phase1_operations.py
          tests/test_phase0_context.py
          tests/test_external_call_policy.py
      - name: Phase 2 observability lint
        working-directory: backend
        run: >-
          ruff check --ignore E501
          modules/observability
          core/telemetry.py
          api/v1/health.py
          api/main.py
          modules/orchestration/providers.py
          workers/celery_app.py
          tests/test_phase2_observability.py
      - name: Phase 2 observability format
        working-directory: backend
        run: >-
          ruff format --check
          modules/observability
          core/telemetry.py
          api/v1/health.py
          api/main.py
          modules/orchestration/providers.py
          workers/celery_app.py
          tests/test_phase2_observability.py
      - name: Phase 3 cache and query lint
        working-directory: backend
        run: >-
          ruff check --ignore E501
          core/cache.py
          core/config.py
          modules/observability/metrics.py
          modules/rag/retrieval.py
          modules/ai/providers.py
          modules/orchestration/repository.py
          modules/orchestration/router.py
          modules/orchestration/services/base.py
          modules/projects/repository.py
          modules/projects/router.py
          modules/projects/service.py
          modules/projects/tasks_service.py
          tests/test_cache_layer.py
          tests/test_phase3_query_paths.py
      - name: Phase 3 cache and query format
        working-directory: backend
        run: >-
          ruff format --check
          core/cache.py
          core/config.py
          modules/observability/metrics.py
          modules/projects/repository.py
          modules/projects/router.py
          tests/test_cache_layer.py
          tests/test_phase3_query_paths.py
      - name: Phase 4 concurrency lint
        working-directory: backend
        run: >-
          ruff check --ignore E501
          core/http_clients.py
          core/config.py
          workers/celery_app.py
          modules/ai/providers.py
          modules/github/service.py
          modules/orchestration/providers.py
          modules/orchestration/tools.py
          modules/orchestration/local_runtime.py
          modules/orchestration/router.py
          modules/platform/service.py
          modules/rag/bulk_ingest.py
          modules/rag/observability.py
          modules/observability/metrics.py
          tests/test_phase4_concurrency.py
      - name: Phase 4 concurrency format
        working-directory: backend
        run: >-
          ruff format --check
          core/http_clients.py
          modules/rag/bulk_ingest.py
          modules/rag/observability.py
          tests/test_phase4_concurrency.py
      - name: Run Phase 4 concurrency tests
        run: python -m pytest backend/tests/test_phase4_concurrency.py -q
      - name: Phase 5 memory lint
        working-directory: backend
        run: >-
          ruff check --ignore E501
          modules/memory/layer
          modules/memory/lifecycle
          modules/memory/models.py
          modules/memory/namespaces.py
          modules/memory/repository.py
          modules/memory/settings.py
          modules/orchestration/repository.py
          modules/orchestration/schemas.py
          modules/orchestration/router.py
          tests/test_phase5_memory_architecture.py
      - name: Phase 5 memory format
        working-directory: backend
        run: >-
          ruff format --check
          modules/memory/layer
          modules/memory/lifecycle
          modules/memory/models.py
          modules/memory/namespaces.py
          modules/memory/repository.py
          modules/memory/settings.py
          tests/test_phase5_memory_architecture.py
      - name: Run Phase 5 memory tests
        run: python -m pytest backend/tests/test_phase5_memory_architecture.py backend/tests/test_memory_layer.py -q
      - name: Phase 6 and 7 architecture lint
        working-directory: backend
        run: >-
          ruff check --ignore E501
          modules/orchestration/presenters.py
          modules/orchestration/services/application.py
          modules/orchestration/execution/policies.py
          modules/orchestration/execution/durable_execution.py
          modules/orchestration/execution/execution_service.py
          modules/orchestration/graphql_router.py
          modules/observability/slo.py
          modules/observability/queue.py
          core/distributed_lock.py
          tools/phase7_validation.py
          tests/test_phase6_modularization.py
          tests/test_phase7_reliability.py
          tests/test_phase7_queue_metrics.py
      - name: Phase 6 and 7 architecture format
        working-directory: backend
        run: >-
          ruff format --check
          modules/orchestration/presenters.py
          modules/orchestration/services/application.py
          modules/orchestration/execution/policies.py
          modules/orchestration/execution/durable_execution.py
          modules/orchestration/execution/execution_service.py
          modules/orchestration/graphql_router.py
          modules/observability/slo.py
          modules/observability/queue.py
          core/distributed_lock.py
          tools/phase7_validation.py
          tests/test_phase6_modularization.py
          tests/test_phase7_reliability.py
          tests/test_phase7_queue_metrics.py
      - name: Run phase 6 and 7 contract tests
        run: >-
          python -m pytest
          backend/tests/test_phase6_modularization.py
          backend/tests/test_phase7_reliability.py
          backend/tests/test_phase7_queue_metrics.py
          backend/tests/test_durable_execution_contract.py
          backend/tests/test_task_orchestration_contract.py
          -q
      - name: Validate observability configuration
        run: >-
          python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('infra/observability/prometheus/alerts.yml').read_text()); yaml.safe_load(pathlib.Path('infra/observability/prometheus/prometheus.yml').read_text())"
      - name: Validate bounded load probe
        run: python backend/tools/phase7_validation.py --help
      - name: Run backend tests
        run: python -m pytest backend/tests -m "not integration" -q
      - name: Run Phase 2 observability tests
        run: python -m pytest backend/tests/test_phase2_observability.py -q
      - name: Run Phase 3 cache and query tests
        run: python -m pytest backend/tests/test_cache_layer.py backend/tests/test_phase3_query_paths.py -q
      - name: Run RAG eval gate
        run: python backend/tools/rag_eval_gate.py backend/tests/fixtures/rag_eval_golden.json --min-pass-rate 1.0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Capture build baseline
        run: pnpm run baseline:build -- --output /tmp/frontend-baseline.json
      - name: Upload build baseline
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-baseline
          path: /tmp/frontend-baseline.json
